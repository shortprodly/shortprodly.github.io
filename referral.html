<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d10"><title>Referral - ShortPro</title><style>body{margin:0;background:#0b0d10;color:#f5f5f5;font-family:Inter,system-ui,sans-serif}.wrap{max-width:520px;margin:auto;padding:18px 16px 90px}.top{padding:8px 4px 20px}.brand{color:#f7d77b;font-weight:800;font-size:18px}.top h1{font-size:25px;margin:18px 0 5px}.top p{color:#9a9da5;font-size:13px}.card{background:#15181d;border:1px solid rgba(233,184,76,.28);border-radius:20px;padding:20px;margin:12px 0}.code{font-size:30px;letter-spacing:3px;color:#f7d77b;font-weight:800;text-align:center;margin:15px 0}.btn{border:0;border-radius:11px;padding:12px 16px;background:linear-gradient(135deg,#f7d77b,#d89e32);font-weight:800;width:100%}.row{display:flex;justify-content:space-between;border-bottom:1px solid #292c32;padding:12px 0;color:#9a9da5}.row b{color:#fff}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0e1014;border-top:1px solid #2b2d33;display:flex;justify-content:space-around;padding:12px}.bottom a{color:#888;text-decoration:none;font-size:12px}.bottom .active{color:#f7d77b}</style></head><body><main class="wrap"><header class="top"><div class="brand">ShortPro · Referral</div><h1>Ajak Teman</h1><p>Bagikan kode referral Anda dan lihat anggota yang terhubung.</p></header><section class="card"><div style="color:#9a9da5;font-size:12px">KODE REFERRAL ANDA</div><div class="code" id="code">—</div><button class="btn" onclick="copyCode()">Salin Kode</button></section><section class="card"><div class="row"><span>Total Referral</span><b id="count">0</b></div><div id="list"></div></section></main><nav class="bottom"><a href="dashboard.html">Home</a><a href="mission.html">Mission</a><a class="active" href="referral.html">Referral</a><a href="profile.html">Profile</a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>let code='';async function load(){const s=await requireAuth();if(!s)return;try{const p=await currentProfile();code=p.referral_code||'';document.getElementById('code').textContent=code||'—';const {data,error,count}=await sb.from('referrals').select('created_at,referred_id,status',{count:'exact'}).eq('referrer_id',s.user.id).order('created_at',{ascending:false});if(error)throw error;document.getElementById('count').textContent=count||0;document.getElementById('list').innerHTML=(data||[]).map(x=>`<div class="row"><span>${new Date(x.created_at).toLocaleDateString('id-ID')}</span><b>${x.status||'terdaftar'}</b></div>`).join('')}catch(e){console.error(e)}}function copyCode(){if(code)navigator.clipboard?.writeText(code).then(()=>alert('Kode referral disalin.'))}load();</script></body></html>
