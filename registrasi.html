<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daftar Akun - MyShort App</title>



<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f2f6ff;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{

width:380px;

background:#fff;

padding:30px;

border-radius:18px;

box-shadow:0 10px 25px rgba(0,0,0,.1);

}

.logo{

text-align:center;
margin-bottom:20px;

}

.logo img{

width:90px;

}

.logo h2{

margin-top:15px;
color:#2d8cff;

}

.input-group{

margin-bottom:15px;

}

label{

display:block;
margin-bottom:6px;
font-weight:bold;
color:#555;

}

input{

width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;

}

input:focus{

outline:none;
border-color:#2d8cff;

}

button{

width:100%;
padding:14px;
background:#2d8cff;
color:#fff;
border:none;
border-radius:8px;
font-size:16px;
font-weight:bold;
cursor:pointer;

}

button:hover{

background:#1976ff;

}

.success{

margin-top:15px;
display:none;
text-align:center;
color:green;
font-weight:bold;

}

.error{

margin-top:15px;
display:none;
text-align:center;
color:red;
font-weight:bold;

}

.bottom{

margin-top:20px;
text-align:center;

}

.bottom a{

color:#2d8cff;
text-decoration:none;
font-weight:bold;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

<div style="font-size:42px;color:#2d8cff;font-weight:800">MS</div>

<h2>Daftar Member</h2>

</div>

<div class="input-group">

<label>Nama Lengkap</label>

<input
type="text"
id="nama"
placeholder="Masukkan Nama">

</div>

<div class="input-group">

<label>Email</label>

<input
type="email"
id="email"
placeholder="Masukkan Email">

</div>

<div class="input-group">

<label>Nomor HP</label>

<input
type="text"
id="hp"
placeholder="08xxxxxxxxxx">

</div>

<div class="input-group">

<label>Password</label>

<input
type="password"
id="password"
placeholder="Minimal 6 karakter">

</div>

<div class="input-group">

<label>Kode Referral (Opsional)</label>

<input
type="text"
id="referral"
placeholder="Masukkan kode referral">

</div>

<button onclick="register()">

DAFTAR SEKARANG

</button>

<p class="success" id="success">
Pendaftaran berhasil.
</p>

<p class="error" id="error">
Semua data wajib diisi.
</p>

<div class="bottom">

Sudah punya akun?

<a href="index.html">

Login

</a>

</div>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
<script src="pages.js"></script>
</body>

</html>
