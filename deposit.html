<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deposit - MyShort App</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
:root{
 --bg:#07090b;--panel:#121417;--panel2:#0d0f12;
 --gold:#f3c95f;--gold2:#ffe7a0;--muted:#92959e;
 --text:#f5f5f6;--line:rgba(243,201,95,.30)
}
html{background:var(--bg)}
body{
 min-height:100vh;padding-bottom:86px;color:var(--text);
 background:
  radial-gradient(circle at 12% 3%,rgba(243,201,95,.14),transparent 25%),
  radial-gradient(circle at 92% 35%,rgba(243,201,95,.065),transparent 28%),
  linear-gradient(145deg,#07090b 0%,#121417 52%,#07090b 100%);
 -webkit-font-smoothing:antialiased
}
body:before{
 content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;
 background-image:radial-gradient(rgba(243,201,95,.72) 1px,transparent 1px);
 background-size:27px 27px
}
header{
 position:relative;z-index:1;text-align:center;padding:23px 18px 19px;
 background:linear-gradient(180deg,rgba(15,17,19,.96),rgba(15,17,19,.72));
 border-bottom:1px solid rgba(243,201,95,.22)
}
header h2{font-size:24px;color:var(--gold2);letter-spacing:.1px;font-weight:800}
.container{position:relative;z-index:1;max-width:760px;margin:auto;padding:18px 15px}
.card{
 background:
  radial-gradient(circle at 100% 0%,rgba(243,201,95,.045),transparent 34%),
  linear-gradient(145deg,rgba(27,29,29,.98),rgba(11,13,16,.99));
 border:1px solid var(--line);border-radius:25px;padding:22px;
 box-shadow:0 18px 55px rgba(0,0,0,.38);position:relative;overflow:hidden
}
.card:after{
 content:"";position:absolute;width:180px;height:180px;right:-105px;top:-95px;
 border:1px solid rgba(243,201,95,.14);border-radius:50%;pointer-events:none
}
label{display:block;margin-top:16px;margin-bottom:7px;color:#c8c9cd;font-size:13px;font-weight:650}
select,input,textarea{
 width:100%;padding:13px 14px;border:1px solid rgba(243,201,95,.22);
 border-radius:13px;background:#0b0d10;color:#f5f5f6;
 font-size:14px;outline:none
}
select:focus,input:focus,textarea:focus{border-color:rgba(243,201,95,.75);box-shadow:0 0 0 3px rgba(243,201,95,.07)}
select{appearance:auto}
textarea{resize:none;height:92px}
.info{
 margin-top:18px;padding:16px;border-radius:16px;
 background:linear-gradient(145deg,rgba(243,201,95,.105),rgba(243,201,95,.035));
 border:1px solid rgba(243,201,95,.20);color:#aeb1b8;font-size:12px;line-height:1.7
}
.info b{color:var(--gold2);font-size:14px}
button{
 width:100%;padding:14px;margin-top:18px;
 background:linear-gradient(135deg,#ffe8a6,#d8a83a);
 color:#18140b;border:1px solid rgba(255,231,160,.7);
 border-radius:14px;font-size:14px;font-weight:850;cursor:pointer;
 box-shadow:0 9px 25px rgba(243,201,95,.15)
}
button:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(243,201,95,.22)}
.bottom{
 position:fixed;z-index:20;bottom:0;left:0;width:100%;height:78px;
 background:rgba(7,9,11,.97);backdrop-filter:blur(16px);
 border-top:1px solid rgba(243,201,95,.18);
 display:flex;justify-content:space-around;padding:7px 4px
}
.bottom a{
 flex:1;text-decoration:none;color:#777b84;font-size:10px;text-align:center;padding-top:1px
}
.bottom a:nth-child(2){color:var(--gold2)}
.bottom span{
 display:block;font-size:19px;line-height:24px;margin-bottom:2px;
 filter:grayscale(.15);transform:scale(.82)
}
@media(max-width:420px){
 .container{padding:14px 12px}.card{padding:18px;border-radius:22px}
 header h2{font-size:22px}.bottom span{font-size:18px}
}
</style>

</head>

<body>

<header>

<h2>Deposit Saldo</h2>

</header>

<div class="container">

<div class="card">

<label>Metode Pembayaran</label>

<select id="metode">

<option value="">Pilih Metode</option>

<option>Transfer Bank</option>

<option>QRIS</option>

<option>E-Wallet</option>

<option>Virtual Account</option>

</select>

<label>Nominal Deposit</label>

<input
type="number"
id="nominal"
placeholder="Contoh: 100000">

<label>Catatan (Opsional)</label>

<textarea
id="catatan"
placeholder="Tambahkan catatan bila diperlukan"></textarea>

<div class="info">

<b>Informasi</b>

<br><br>

• Minimal deposit Rp10.000

<br>

• Maksimal deposit Rp10.000.000

<br>

• Status awal transaksi: Menunggu Pembayaran

</div>

<button onclick="kirimDeposit()">

Kirim Deposit

</button>

</div>

</div>

<div class="bottom">

<a href="dashboard.html">

<span>🏠</span>

Home

</a>

<a href="wallet.html">

<span>💰</span>

Wallet

</a>

<a href="mission.html">

<span>🎯</span>

Mission

</a>

<a href="profile.html">

<span>👤</span>

Profile

</a>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
<script src="pages.js"></script>
</body>

</html>
