<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Profil Member - MyShort App</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090b;
  --card:#111316;
  --card2:#0d0f12;
  --gold:#f3c95f;
  --gold2:#ffe6a0;
  --muted:#92959e;
  --white:#f7f7f8;
  --line:rgba(243,201,95,.34);
}
html{background:var(--bg)}
body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 8%,rgba(243,201,95,.12),transparent 25%),
    radial-gradient(circle at 88% 38%,rgba(243,201,95,.055),transparent 28%),
    linear-gradient(145deg,#07090b 0%,#101216 52%,#07090b 100%);
  color:var(--white);
  min-height:100vh;
  padding-bottom:92px;
  -webkit-font-smoothing:antialiased;
}
body:before{
  content:"";
  position:fixed;inset:0;pointer-events:none;opacity:.20;
  background-image:radial-gradient(rgba(243,201,95,.72) 1px,transparent 1px);
  background-size:27px 27px;
}
.top{
  padding:22px 20px 6px;
  display:flex;align-items:center;gap:14px;
  position:relative;z-index:1;
}
.logo{
  width:62px;height:62px;
  border:2px solid rgba(243,201,95,.78);
  border-radius:20px;
  display:grid;place-items:center;
  color:var(--gold2);font-size:23px;font-weight:800;
  background:rgba(243,201,95,.035);
  box-shadow:0 0 26px rgba(243,201,95,.07);
}
.brand b{font-size:22px;letter-spacing:-.4px}
.brand span{display:block;color:var(--muted);margin-top:3px;font-size:14px}
.wrap{
  max-width:760px;margin:auto;
  padding:14px 18px 0;
  position:relative;z-index:1;
}
.member-head{
  display:flex;align-items:center;gap:16px;
  padding:20px 2px 26px;
}
.avatar{
  flex:0 0 82px;width:82px;height:82px;
  border-radius:25px;
  border:2px solid rgba(243,201,95,.64);
  display:grid;place-items:center;
  color:var(--gold2);font-weight:800;font-size:27px;
  background:linear-gradient(145deg,#242018,#101114);
  box-shadow:0 0 24px rgba(243,201,95,.045);
}
.member-main{min-width:0;flex:1}
.member-main h1{
  font-size:25px;line-height:1.15;
  margin-bottom:6px;letter-spacing:-.3px;
}
.uid{color:var(--muted);font-size:13px;margin-bottom:10px}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,var(--gold2),var(--gold));
  color:#1b170d;
  font-size:11px;font-weight:800;
  padding:8px 13px;border-radius:999px;
  letter-spacing:.15px;
  box-shadow:0 4px 18px rgba(243,201,95,.12);
}
.badge:before{content:"✓";font-size:12px}
.edit-icon{
  flex:0 0 52px;width:52px;height:52px;
  border-radius:17px;
  border:1px solid var(--line);
  background:rgba(20,19,15,.8);
  color:var(--gold2);
  font-size:22px;cursor:pointer;
}
.card{
  background:
    radial-gradient(circle at 100% 0%,rgba(243,201,95,.025),transparent 30%),
    linear-gradient(145deg,rgba(25,25,23,.97),rgba(12,14,17,.99));
  border:1px solid var(--line);
  border-radius:26px;
  padding:22px;
  box-shadow:0 18px 50px rgba(0,0,0,.30);
  margin-bottom:18px;
}
.level-card{position:relative;overflow:hidden}
.level-card:after{
  content:"";
  position:absolute;width:220px;height:220px;
  right:-125px;top:-110px;
  border:1px solid rgba(243,201,95,.20);
  border-radius:50%;
}
.level-row{display:flex;align-items:center;gap:16px}
.level-badge{
  width:68px;height:78px;
  display:grid;place-items:center;text-align:center;
  border:1px solid var(--line);
  border-radius:20px;
  color:var(--gold2);
  background:rgba(243,201,95,.045);
  font-weight:800;
}
.level-badge small{display:block;font-size:11px;color:var(--muted);letter-spacing:.3px}
.level-title{color:#b9bbc0;font-size:13px;margin-bottom:3px}
.level-name{
  font-size:31px;color:var(--gold2);
  font-weight:800;letter-spacing:-.7px;
}
.arrow{margin-left:auto;color:#d4ad52;font-size:34px}
.progress{
  height:11px;background:#07090b;border-radius:999px;
  margin:20px 0 12px;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.025);
}
.progress span{
  display:block;height:100%;width:0%;
  border-radius:inherit;
  background:linear-gradient(90deg,#bd8d32,#ffe39a);
}
.progress-info{
  display:flex;justify-content:space-between;
  color:var(--muted);font-size:13px;
}
.section-title{
  display:flex;align-items:center;gap:9px;
  font-size:19px;margin-bottom:12px;
  letter-spacing:-.2px;
}
.section-title:before{
  content:"♙";
  color:var(--gold2);
  font-size:20px;
}
.info-row{
  min-height:57px;
  border-bottom:1px solid rgba(255,255,255,.075);
  display:flex;align-items:center;
  justify-content:space-between;
  gap:18px;
}
.info-row:last-child{border-bottom:0}
.label{color:var(--muted);font-size:13px}
.value{
  text-align:right;font-weight:600;
  font-size:13px;word-break:break-word;
}
.value.gold{color:var(--gold2)}
.edit-form{
  display:none;margin-top:18px;padding-top:18px;
  border-top:1px solid rgba(243,201,95,.18)
}
.edit-form.show{display:block}
.field{margin-bottom:13px}
.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}
.field input{
  width:100%;padding:12px 13px;
  border-radius:12px;border:1px solid #35373d;
  background:#0b0c0f;color:#fff;outline:none;font-size:14px;
}
.field input:focus{border-color:var(--gold)}
.actions{display:flex;gap:10px;margin-top:15px}
.btn{flex:1;padding:12px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer}
.save{border:0;background:linear-gradient(135deg,#ffe8a3,#d9aa3c);color:#17130a}
.cancel{border:1px solid #3b3d43;background:#16181c;color:#ddd}
.note{color:#72757d;font-size:11px;margin-top:12px;line-height:1.5}
.nav{
  position:fixed;z-index:10;left:0;right:0;bottom:0;
  height:78px;
  background:rgba(8,10,12,.96);
  backdrop-filter:blur(16px);
  border-top:1px solid rgba(243,201,95,.16);
  display:flex;justify-content:space-around;
}
.nav a{
  flex:1;text-decoration:none;color:#777b84;
  text-align:center;padding-top:9px;font-size:11px;
}
.nav a.active{color:var(--gold2)}
.nav i{
  display:block;font-style:normal;
  font-size:25px;margin-bottom:2px;
}
.toast{
  position:fixed;z-index:20;left:50%;bottom:92px;
  transform:translate(-50%,15px);
  opacity:0;pointer-events:none;
  background:#e7c45d;color:#17130a;
  padding:10px 16px;border-radius:12px;
  font-size:13px;font-weight:700;transition:.25s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:480px){
  .top{padding:18px 15px 4px}
  .logo{width:58px;height:58px;border-radius:18px;font-size:21px}
  .brand b{font-size:20px}.brand span{font-size:13px}
  .wrap{padding:9px 13px 0}
  .member-head{padding:18px 1px 22px;gap:13px}
  .avatar{flex-basis:76px;width:76px;height:76px;border-radius:23px;font-size:25px}
  .member-main h1{font-size:23px}
  .edit-icon{width:48px;height:48px;flex-basis:48px}
  .card{padding:19px;border-radius:23px}
  .level-name{font-size:29px}
  .level-badge{width:63px;height:73px}
  .info-row{min-height:54px}
}
</style>
<link rel="stylesheet" href="premium-brand.css">


</head>
<body>

</div>

<main class="wrap">
  <section class="member-head">
    <div class="avatar"><img class="sp-logo" src="logo.png" alt="MyShort Logo"></div>
    <div class="member-main">
      <h1 id="headerName">Nama Member</h1>
      <div class="uid">UID <span id="uid">—</span></div>
      <span class="badge" id="statusBadge">MEMBER AKTIF</span>
    </div>
    <button class="edit-icon" type="button" onclick="showEdit()" aria-label="Edit profil">✎</button>
  </section>

  <section class="card level-card">
    <div class="level-row">
      <div class="level-badge"><div><small>LEVEL</small><br><span id="levelShort">1</span></div></div>
      <div>
        <div class="level-title">Level saya</div>
        <div class="level-name" id="levelName">LV 1</div>
      </div>
      <div class="arrow">›</div>
    </div>
    <div class="progress"><span id="xpBar"></span></div>
    <div class="progress-info"><span id="xpText">0 / 50 XP</span><span id="nextLevel">Menuju LV 2</span></div>
  </section>

  <section class="card">
    <div class="section-title">Informasi Member</div>
    <div class="info-row"><span class="label">Nama</span><span class="value" id="nama">—</span></div>
    <div class="info-row"><span class="label">Email</span><span class="value" id="email">—</span></div>
    <div class="info-row"><span class="label">Nomor HP</span><span class="value" id="phone">—</span></div>
    <div class="info-row"><span class="label">Kode Referral</span><span class="value gold" id="referral">—</span></div>
    <div class="info-row"><span class="label">Status Member</span><span class="value gold" id="status">Aktif</span></div>
    <div class="info-row"><span class="label">Level</span><span class="value" id="level">LV 1</span></div>

    <div class="edit-form" id="editForm">
      <div class="field"><label for="editNama">Nama Member</label><input id="editNama" type="text" autocomplete="name" placeholder="Masukkan nama lengkap"></div>
      <div class="field"><label for="editEmail">Email</label><input id="editEmail" type="email" autocomplete="email" placeholder="Masukkan email"></div>
      <div class="field"><label for="editPhone">Nomor HP</label><input id="editPhone" type="tel" autocomplete="tel" placeholder="Masukkan nomor HP"></div>
      <div class="actions">
        <button class="btn cancel" type="button" onclick="hideEdit()">Batal</button>
        <button class="btn save" type="button" onclick="saveProfile()">Simpan</button>
      </div>
      <div class="note">Perubahan profil disimpan langsung ke database Supabase.</div>
    </div>
  </section>
</main>
