<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Profil Member - ShortPro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08090b;--card:#15171c;--card2:#101216;
  --gold:#f1c85b;--gold2:#ffe7a0;--muted:#8d9098;
  --line:rgba(241,200,91,.28);--white:#f7f7f8;
}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 12% 8%,rgba(241,200,91,.10),transparent 24%),
    radial-gradient(circle at 90% 28%,rgba(241,200,91,.07),transparent 25%),
    linear-gradient(145deg,#090a0c,#111216 55%,#08090b);
  color:var(--white);min-height:100vh;padding-bottom:92px;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;
  background-image:radial-gradient(#e9c86a 1px,transparent 1px);
  background-size:24px 24px;
}
.top{
  padding:22px 24px 8px;display:flex;align-items:center;gap:16px;
  position:relative;z-index:1;
}
.logo{
  width:68px;height:68px;border:2px solid rgba(241,200,91,.65);
  border-radius:20px;display:grid;place-items:center;
  color:var(--gold2);font-size:25px;font-weight:800;
  background:rgba(241,200,91,.04);box-shadow:0 0 22px rgba(241,200,91,.08);
}
.brand b{font-size:24px}.brand span{display:block;color:var(--muted);margin-top:5px;font-size:16px}
.wrap{max-width:760px;margin:auto;padding:18px 18px 0;position:relative;z-index:1}
.member-head{
  display:flex;align-items:center;gap:18px;padding:24px 4px 26px;
}
.avatar{
  flex:0 0 92px;width:92px;height:92px;border-radius:28px;
  border:2px solid rgba(241,200,91,.58);display:grid;place-items:center;
  color:var(--gold2);font-weight:800;font-size:30px;
  background:linear-gradient(145deg,#242018,#101114);
}
.member-main{min-width:0;flex:1}
.member-main h1{font-size:28px;line-height:1.15;margin-bottom:7px}
.uid{color:var(--muted);font-size:15px;margin-bottom:11px}
.badge{
  display:inline-block;background:linear-gradient(135deg,var(--gold2),var(--gold));
  color:#1b170d;font-size:13px;font-weight:800;padding:8px 14px;border-radius:999px;
}
.edit-icon{
  flex:0 0 54px;width:54px;height:54px;border-radius:17px;
  border:1px solid var(--line);background:#15130e;color:var(--gold2);
  font-size:22px;cursor:pointer;
}
.card{
  background:linear-gradient(145deg,rgba(30,27,21,.96),rgba(14,15,18,.98));
  border:1px solid var(--line);border-radius:28px;padding:24px;
  box-shadow:0 16px 45px rgba(0,0,0,.32);margin-bottom:18px;
}
.level-card{position:relative;overflow:hidden}
.level-card:after{
  content:"";position:absolute;width:180px;height:180px;right:-100px;top:-90px;
  border:1px solid rgba(241,200,91,.18);border-radius:50%;
}
.level-row{display:flex;align-items:center;gap:18px}
.level-badge{
  width:72px;height:82px;display:grid;place-items:center;text-align:center;
  border:1px solid var(--line);border-radius:20px;color:var(--gold2);
  background:rgba(241,200,91,.06);font-weight:800;
}
.level-badge small{display:block;font-size:12px;color:var(--muted)}
.level-title{color:#b8b8bd;font-size:15px;margin-bottom:5px}
.level-name{font-size:34px;color:var(--gold2);font-weight:800}
.arrow{margin-left:auto;color:#b89a50;font-size:30px}
.progress{height:13px;background:#08090b;border-radius:999px;margin:22px 0 13px;overflow:hidden}
.progress span{display:block;height:100%;width:0%;border-radius:inherit;background:linear-gradient(90deg,#b8862d,#ffe39a)}
.progress-info{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
.section-title{font-size:20px;margin-bottom:17px}
.info-row{
  min-height:58px;border-bottom:1px solid rgba(255,255,255,.07);
  display:flex;align-items:center;justify-content:space-between;gap:18px;
}
.info-row:last-child{border-bottom:0}
.label{color:var(--muted);font-size:15px}.value{text-align:right;font-weight:600;font-size:15px;word-break:break-word}
.value.gold{color:var(--gold2)}
.edit-form{display:none;margin-top:18px;padding-top:18px;border-top:1px solid rgba(241,200,91,.18)}
.edit-form.show{display:block}
.field{margin-bottom:13px}
.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}
.field input{
  width:100%;padding:13px 14px;border-radius:12px;border:1px solid #35373d;
  background:#0b0c0f;color:#fff;outline:none;font-size:15px;
}
.field input:focus{border-color:var(--gold)}
.actions{display:flex;gap:10px;margin-top:15px}
.btn{flex:1;padding:13px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
.save{border:0;background:linear-gradient(135deg,#ffe8a3,#d9aa3c);color:#17130a}
.cancel{border:1px solid #3b3d43;background:#16181c;color:#ddd}
.note{color:#72757d;font-size:12px;margin-top:12px;line-height:1.5}
.nav{
  position:fixed;z-index:10;left:0;right:0;bottom:0;height:78px;
  background:rgba(10,11,13,.96);backdrop-filter:blur(15px);
  border-top:1px solid rgba(241,200,91,.18);display:flex;justify-content:space-around;
}
.nav a{flex:1;text-decoration:none;color:#777b84;text-align:center;padding-top:10px;font-size:12px}
.nav a.active{color:var(--gold2)}
.nav i{display:block;font-style:normal;font-size:27px;margin-bottom:3px}
.toast{
  position:fixed;z-index:20;left:50%;bottom:92px;transform:translate(-50%,15px);
  opacity:0;pointer-events:none;background:#e7c45d;color:#17130a;padding:11px 17px;
  border-radius:12px;font-size:14px;font-weight:700;transition:.25s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:480px){
  .top{padding:18px 17px 3px}.logo{width:62px;height:62px;border-radius:18px}
  .brand b{font-size:22px}.brand span{font-size:14px}
  .wrap{padding:10px 14px 0}.member-head{padding:22px 2px}
  .avatar{flex-basis:82px;width:82px;height:82px;border-radius:25px;font-size:27px}
  .member-main h1{font-size:25px}.edit-icon{width:48px;height:48px;flex-basis:48px}
  .card{padding:20px;border-radius:24px}.level-name{font-size:31px}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body>


</div>

<main class="wrap">
  <section class="member-head">
    <div class="avatar">SP</div>
    <div class="member-main">
      <h1 id="headerName">Nama Member</h1>
      <div class="uid">UID <span id="uid">—</span></div>
      <span class="badge" id="statusBadge">MEMBER AKTIF</span>
    </div>
    <button class="edit-icon" type="button" onclick="showEdit()" aria-label="Edit profil">✎</button>
  </section>

  <section class="card level-card">
    <div class="level-row">
      <div class="level-badge"><div><small>LEVEL</small><br><span id="levelShort">1</span></div></div>
      <div>
        <div class="level-title">Level saya</div>
        <div class="level-name" id="levelName">LV 1</div>
      </div>
      <div class="arrow">›</div>
    </div>
    <div class="progress"><span id="xpBar"></span></div>
    <div class="progress-info"><span id="xpText">0 / 50 XP</span><span id="nextLevel">Menuju LV 2</span></div>
  </section>

  <section class="card">
    <div class="section-title">Informasi Member</div>
    <div class="info-row"><span class="label">Nama</span><span class="value" id="nama">—</span></div>
    <div class="info-row"><span class="label">Email</span><span class="value" id="email">—</span></div>
    <div class="info-row"><span class="label">Nomor HP</span><span class="value" id="phone">—</span></div>
    <div class="info-row"><span class="label">Kode Referral</span><span class="value gold" id="referral">—</span></div>
    <div class="info-row"><span class="label">Status Member</span><span class="value gold" id="status">Aktif</span></div>
    <div class="info-row"><span class="label">Level</span><span class="value" id="level">LV 1</span></div>

    <div class="edit-form" id="editForm">
      <div class="field"><label for="editNama">Nama Member</label><input id="editNama" type="text" autocomplete="name" placeholder="Masukkan nama lengkap"></div>
      <div class="field"><label for="editEmail">Email</label><input id="editEmail" type="email" autocomplete="email" placeholder="Masukkan email"></div>
      <div class="field"><label for="editPhone">Nomor HP</label><input id="editPhone" type="tel" autocomplete="tel" placeholder="Masukkan nomor HP"></div>
      <div class="actions">
        <button class="btn cancel" type="button" onclick="hideEdit()">Batal</button>
        <button class="btn save" type="button" onclick="saveProfile()">Simpan</button>
      </div>
      <div class="note">Perubahan disimpan langsung ke database Supabase untuk akun member ini.</div>
    </div>
  </section>
</main>

<nav class="nav">
  <a href="dashboard.html"><i>⌂</i>Home</a>
  <a href="mission.html"><i>◎</i>Mission</a>
  <a href="wallet.html"><i>▣</i>Wallet</a>
  <a href="profile.html" class="active"><i>♙</i>Profile</a>
</nav>

<div class="toast" id="toast">Profil berhasil disimpan</div>

<script>
"use strict";
let profile=null;
function firstValue(){for(const v of arguments){if(v!==undefined&&v!==null&&String(v).trim()!=="")return String(v)}return "—"}
async function loadProfile(){
 const session=await requireAuth(); if(!session)return;
 try{profile=await currentProfile();
  const name=firstValue(profile.full_name,profile.username), email=firstValue(profile.email,session.user.email), phone=firstValue(profile.phone), referral=firstValue(profile.referral_code), status=firstValue(profile.status,"Aktif"), level=firstValue(profile.level,"LV 1"),uid=firstValue(profile.uid,session.user.id);
  document.getElementById("nama").textContent=name;document.getElementById("email").textContent=email;document.getElementById("phone").textContent=phone;document.getElementById("referral").textContent=referral;document.getElementById("status").textContent=status;document.getElementById("statusBadge").textContent=String(status).toUpperCase();document.getElementById("level").textContent=level;document.getElementById("uid").textContent=uid;
  const match=String(level).match(/(\d+)/),n=match?Number(match[1]):1;document.getElementById("levelShort").textContent=n;document.getElementById("levelName").textContent="LV "+n;document.getElementById("nextLevel").textContent="Menuju LV "+(n+1);
  document.getElementById("editNama").value=name==="—"?"":name;document.getElementById("editEmail").value=email==="—"?"":email;document.getElementById("editPhone").value=phone==="—"?"":phone;
 }catch(e){console.error(e);toastMsg("Gagal memuat profil.");}
}
function showEdit(){document.getElementById("editForm").classList.add("show");document.getElementById("editNama").focus()}
function hideEdit(){document.getElementById("editForm").classList.remove("show")}
async function saveProfile(){
 const nama=document.getElementById("editNama").value.trim(), email=document.getElementById("editEmail").value.trim(), phone=document.getElementById("editPhone").value.trim();
 if(!nama||!email){toastMsg("Nama dan email wajib diisi.");return;}
 try{const session=await requireAuth();if(!session)return;const {error}=await sb.from("profiles").update({full_name:nama,email,phone}).eq("id",session.user.id);if(error)throw error;await loadProfile();hideEdit();toastMsg("Profil berhasil disimpan ke database.");}
 catch(e){toastMsg(e.message||"Gagal menyimpan profil.");}
}
document.addEventListener("DOMContentLoaded",loadProfile);
</script>
</body>
</html>
