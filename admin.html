<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d10"><title>Admin - ShortPro</title><style>body{margin:0;background:#0b0d10;color:#f5f5f5;font-family:Inter,system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:20px 16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:800;color:#f7d77b}.btn{border:1px solid #7a5b24;background:#1b1710;color:#f7d77b;border-radius:9px;padding:9px 12px}.card{background:#15181d;border:1px solid #3d3524;border-radius:16px;padding:16px;margin:12px 0;overflow:auto}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat div{background:#101216;border:1px solid #292c32;border-radius:12px;padding:14px}.stat b{display:block;font-size:22px;color:#f7d77b}.row{display:flex;gap:12px;justify-content:space-between;align-items:center;border-bottom:1px solid #292c32;padding:12px 0;font-size:12px}.muted{color:#888}.action{display:flex;gap:6px}.approve,.reject{border:0;border-radius:8px;padding:7px 9px;font-size:11px}.approve{background:#1e5c3b;color:#b8ffd8}.reject{background:#5d2525;color:#ffd0d0}</style></head><body><main class="wrap"><div class="top"><div class="brand">ShortPro Admin</div><button class="btn" onclick="logoutSupabase()">Logout</button></div><section class="stat"><div>Member<b id="members">0</b></div><div>Saldo<b id="balance">Rp 0</b></div><div>Pending WD<b id="pending">0</b></div></section><section class="card"><h2>Withdrawal Pending</h2><div id="withdrawals" class="muted">Memuat...</div></section><section class="card"><h2>Member Terbaru</h2><div id="membersList" class="muted">Memuat...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>async function load(){const s=await requireAuth();if(!s)return;try{const p=await currentProfile();if(p.role!=='admin'){alert('Akses admin ditolak');location.href='dashboard.html';return}const {count}=await sb.from('profiles').select('id',{count:'exact',head:true});document.getElementById('members').textContent=count||0;const {data:ws}=await sb.from('wallets').select('balance');document.getElementById('balance').textContent='Rp '+moneyIDR((ws||[]).reduce((a,x)=>a+Number(x.balance||0),0));const {data:w}=await sb.from('withdrawals').select('id,user_id,amount,method,account_number,account_name,status,created_at,admin_note').eq('status','pending').order('created_at',{ascending:false});document.getElementById('pending').textContent=(w||[]).length;document.getElementById('withdrawals').innerHTML=(w||[]).map(x=>`<div class="row"><div><b>Rp ${moneyIDR(x.amount)}</b><br>${x.method} · ${x.account_number} · ${x.account_name}<br><span class="muted">${new Date(x.created_at).toLocaleString('id-ID')}</span></div><div class="action"><button class="approve" onclick="setWD(${x.id},'approved')">Setujui</button><button class="reject" onclick="setWD(${x.id},'rejected')">Tolak</button></div></div>`).join('')||'Tidak ada withdrawal pending.';const {data:ms}=await sb.from('profiles').select('uid,username,full_name,email,status,level,created_at').order('created_at',{ascending:false}).limit(20);document.getElementById('membersList').innerHTML=(ms||[]).map(x=>`<div class="row"><div><b>${x.full_name}</b><br>${x.username} · ${x.email}<br><span class="muted">${x.uid} · ${x.level} · ${x.status}</span></div></div>`).join('')}catch(e){console.error(e);alert(e.message||'Gagal memuat admin')}}async function setWD(id,status){const note=status==='rejected'?prompt('Alasan penolakan:')||'Ditolak admin':null;try{const {error}=await sb.rpc('admin_set_withdrawal_status',{p_id:id,p_status:status,p_note:note});if(error)throw error;load()}catch(e){alert(e.message||'Gagal memproses')}}load();</script></body></html>
