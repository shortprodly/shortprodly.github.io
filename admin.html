<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyShort App Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090a0d;color:#f5f5f5;font-family:Arial,sans-serif;padding:20px}
.wrap{max-width:1000px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.head h1{color:#f3c95f}
h2,h3{color:#ffe7a0;margin-top:22px}.table{display:grid;gap:8px}.row{background:#15171b;border:1px solid #2b2d32;border-radius:12px;padding:13px;display:flex;justify-content:space-between;gap:12px;align-items:center}.row small{display:block;color:#999;margin-top:5px}
button{border:0;border-radius:8px;padding:8px 12px;cursor:pointer;background:#e6b84f;color:#111;font-weight:bold;margin:2px}.logout{background:#333;color:#fff}.nav{color:#f3c95f;text-decoration:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;padding:10px 15px;border-radius:10px;display:none}.toast.show{display:block}
</style></head><body><div class="wrap"><div class="head"><h1>MyShort App Admin</h1><button class="logout" onclick="logoutSupabase()">Logout</button></div><div id="adminRoot">Memuat...</div><p><a class="nav" href="dashboard.html">← Kembali ke dashboard</a></p></div><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script><script src="pages.js"></script></body></html>
