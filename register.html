<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d10"><title>Daftar - ShortPro</title><style>body{margin:0;background:#0b0d10;color:#f5f5f5;font-family:Inter,system-ui,sans-serif}.wrap{max-width:430px;margin:auto;padding:28px 18px}.brand{text-align:center;color:#f7d77b;font-size:25px;font-weight:800;margin:12px 0 25px}.brand small{display:block;color:#9a9da5;font-size:12px;font-weight:500;margin-top:4px}.card{background:#15181d;border:1px solid rgba(233,184,76,.3);border-radius:22px;padding:22px;box-shadow:0 20px 60px #0008}h1{font-size:25px;margin:0 0 7px}p{color:#9a9da5;font-size:13px;margin:0 0 20px}.field{margin:13px 0}.field label{display:block;font-size:12px;color:#b9bcc3;margin-bottom:7px}.field input{width:100%;box-sizing:border-box;background:#101216;border:1px solid #3b3e45;color:#fff;padding:13px 14px;border-radius:12px;outline:none}.field input:focus{border-color:#e9b84c}.btn{width:100%;border:0;border-radius:12px;padding:14px;background:linear-gradient(135deg,#f7d77b,#d89e32);font-weight:800;color:#17120a;margin-top:10px}.back{text-align:center;margin-top:18px;font-size:13px;color:#9a9da5}.back a{color:#f7d77b}.note{font-size:11px;color:#777;margin-top:15px;line-height:1.5}</style></head><body><main class="wrap"><div class="brand">ShortPro<small>Member Area</small></div><section class="card"><h1>Buat Akun Member</h1><p>Daftar untuk mengakses dashboard, mission, referral dan wallet.</p><form id="registerForm"><div class="field"><label>Nama Lengkap</label><input id="name" required></div><div class="field"><label>Username</label><input id="username" required pattern="[A-Za-z0-9_]{3,30}"></div><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Nomor HP</label><input id="phone" type="tel"></div><div class="field"><label>Kode Referral (opsional)</label><input id="referral" placeholder="Contoh: ABC123456"></div><div class="field"><label>Password</label><input id="password" type="password" minlength="6" required></div><button class="btn">Daftar Sekarang</button></form><div class="back">Sudah punya akun? <a href="login.html">Login</a></div><div class="note">Password diproses oleh Supabase Auth. Jangan pernah menaruh service_role key di file HTML.</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>document.getElementById('registerForm').addEventListener('submit',async e=>{e.preventDefault();const name=document.getElementById('name').value.trim(),username=document.getElementById('username').value.trim(),email=document.getElementById('email').value.trim(),phone=document.getElementById('phone').value.trim(),referral=document.getElementById('referral').value.trim().toUpperCase(),password=document.getElementById('password').value;try{const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:name,username,phone,referred_by_code:referral}}});if(error)throw error;alert(data.session?'Pendaftaran berhasil.':'Pendaftaran berhasil. Cek email jika konfirmasi email diaktifkan.');location.href=data.session?'dashboard.html':'login.html';}catch(err){alert(err.message||'Pendaftaran gagal.')}});</script></body></html>
